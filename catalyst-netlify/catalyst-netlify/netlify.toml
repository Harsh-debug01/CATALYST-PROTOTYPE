[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# The frontend calls fetch("/v1/messages") — this makes that path
# transparently hit the serverless function, no frontend code changes needed.
[[redirects]]
  from = "/v1/messages"
  to = "/.netlify/functions/messages"
  status = 200
  force = true
